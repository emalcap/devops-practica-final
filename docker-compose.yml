version: '3.9'

services:

  postgres:

    image: postgres:16

    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_DB: backenddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

  backend:

    build: .

    container_name: backend-node

    restart: always

    depends_on:
      - postgres

    ports:
      - "3000:3000"

    env_file:
      - .env