apiVersion: batch/v1
kind: CronJob
metadata:
  name: database-backup
  namespace: backend-app
spec:
  schedule: "0 */3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: database-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: emalcap/backup-job:latest
              env:
                - name: DB_HOST
                  value: "postgres-service"
                - name: DB_USER_NAME
                  value: "postgres"
                - name: DB_NAME
                  value: "backenddb"
                - name: DB_PORT
                  value: "5432"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: DB_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  value: "TU_ACCESS_KEY"
                - name: AWS_SECRET_ACCESS_KEY
                  value: "TU_SECRET_KEY"
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
